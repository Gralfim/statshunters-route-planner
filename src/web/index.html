<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>StatsHunters Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#panel{
  position:absolute;
  top:12px;
  right:12px;
  z-index:1000;
  width:min(320px,calc(100vw - 24px));
  max-height:calc(100vh - 24px);
  overflow-y:auto;
  background:#fff;
  border:1px solid #d7dde3;
  border-radius:8px;
  box-shadow:0 8px 24px rgba(26,32,44,.18);
  padding:12px;
}
#panel h1{font-size:16px;line-height:1.2;margin:0 0 10px}
#stats{display:grid;gap:8px;margin-bottom:12px}
.period{border:1px solid #e5e9ef;border-radius:6px;padding:8px}
.period header{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.swatch{width:14px;height:14px;border-radius:3px;display:inline-block}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.label{font-size:10px;color:#53606f;text-transform:uppercase}
.value{font-size:16px;font-weight:700;margin-top:2px}
#layers{display:grid;gap:6px}
#layers label{display:flex;align-items:center;gap:8px;font-size:14px}
#legend{display:grid;gap:4px;margin-top:10px;font-size:12px;color:#53606f}
#legend .swatch{width:10px;height:10px;margin-right:4px}
#route{margin-top:12px;border-top:1px solid #e5e9ef;padding-top:10px;display:grid;gap:6px}
#route .route-inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#route .route-inputs label{display:grid;gap:2px;font-size:11px;color:#53606f;text-transform:uppercase}
#route input{padding:5px 6px;border:1px solid #d7dde3;border-radius:4px;font-size:14px;width:100%;box-sizing:border-box}
#plan{padding:8px;border:0;border-radius:6px;background:#111827;color:#fff;font-weight:600;cursor:pointer}
#plan:disabled{background:#9aa2af;cursor:wait}
#gpx{padding:7px;border:1px solid #111827;border-radius:6px;background:#fff;color:#111827;font-weight:600;cursor:pointer}
#route-status,#route-start{font-size:12px;color:#53606f}
#route-benefit{font-size:12px;color:#1a202c;background:#f4f6f8;border-radius:6px;padding:8px;line-height:1.5}
#sync{margin-top:12px;width:100%;padding:8px;border:0;border-radius:6px;background:#2a78d6;color:#fff;font-weight:600;cursor:pointer}
#sync:disabled{background:#9ec5f4;cursor:wait}
#sync-status{margin-top:6px;color:#b91c1c}
</style>
</head>
<body>
<div id="map"></div>
<aside id="panel">
  <h1>StatsHunters Route Planner</h1>
  <div id="stats"></div>
  <div id="layers">
    <label><input type="checkbox" data-overlay="tiles" checked> Tiles</label>
    <label><input type="checkbox" data-overlay="opportunities" checked> Doporucene tiles</label>
    <label><input type="checkbox" data-overlay="cluster" checked> Cluster obrysy</label>
    <label><input type="checkbox" data-overlay="square" checked> Square obrysy</label>
  </div>
  <div id="legend"></div>
  <div id="route">
    <div class="label">Planovani trasy</div>
    <div class="route-inputs">
      <label>Delka (km)<input id="route-distance" type="number" min="2" max="42" step="0.5"></label>
      <label>Tolerance (km)<input id="route-tolerance" type="number" min="0.5" max="10" step="0.5"></label>
    </div>
    <div id="route-start"></div>
    <button id="plan">Naplanovat trasu</button>
    <div id="route-status"></div>
    <div id="route-benefit" hidden></div>
    <button id="gpx" hidden>Stahnout GPX</button>
  </div>
  <button id="sync">Aktualizovat data ze StatsHunters</button>
  <div id="sync-status" class="label"></div>
</aside>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
