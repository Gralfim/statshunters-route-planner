[pytest]
testpaths = tests
# Rychle testy bezi nad rucne postavenymi grafy a cistymi funkcemi (< 1 s).
# Testy oznacene `slow` potrebuji stazeny pesi graf Prahy a data aktivit
# (pres minutu) - spousti se vyslovne: pytest -m slow
addopts = -m "not slow"
markers =
    slow: potrebuje skutecny graf z data/ a bezi v radu minut
